<script>
// ============================================================================ TIỆN ÍCH
function $(id) { return document.getElementById(id); }
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function goi(ten) {                       // gọi hàm máy chủ, trả về Promise
  var args = Array.prototype.slice.call(arguments, 1);
  return new Promise(function (ok, loi) {
    var r = google.script.run.withSuccessHandler(ok).withFailureHandler(function (e) { loi(e); });
    r[ten].apply(r, args);
  });
}
var demCho = 0;
function cho(bat) { demCho = Math.max(0, demCho + (bat ? 1 : -1)); $('cho').style.display = demCho > 0 ? 'flex' : 'none'; }
// Thông báo nhỏ ở cuối màn hình; có thể kèm 1 nút (VD "Hoàn tác")
function bao(msg, ms, nhanNut, khiBam) {
  var t = $('toast'); t.innerHTML = '<span>' + esc(msg) + '</span>' + (nhanNut ? ' <button id="toastNut">' + esc(nhanNut) + '</button>' : '');
  t.style.display = 'flex'; clearTimeout(bao._t);
  if (nhanNut) $('toastNut').onclick = function () { t.style.display = 'none'; clearTimeout(bao._t); khiBam(); };
  bao._t = setTimeout(function () { t.style.display = 'none'; }, ms || (nhanNut ? 8000 : 3500));
}
function chay(ten) {                      // gọi máy chủ có hiện "Đang xử lý" và báo lỗi
  var args = arguments; cho(true);
  return goi.apply(null, args).then(function (x) { cho(false); return x; }, function (e) { cho(false); bao('Lỗi: ' + (e && e.message || e), 7000); throw e; });
}
function isoToDmy(s) { var p = s.split('-'); return p[2] + '/' + p[1] + '/' + p[0]; }
function dmyToIso(d) { var p = d.split('/'); return p[2] + '-' + p[1] + '-' + p[0]; }
function homNayIso() { var d = new Date(); return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2); }
function docFile(input) {
  return new Promise(function (ok, loi) {
    var f = input.files[0]; if (!f) return;
    var r = new FileReader(); r.onload = function () { ok({ ten: f.name, data: r.result }); }; r.onerror = loi; r.readAsArrayBuffer(f);
  });
}
// Lỗi đọc file (hỏng, sai loại) → câu dễ hiểu thay cho thông báo kĩ thuật tiếng Anh
function loiFile(e, loai) {
  var m = (e && e.message) || String(e);
  if (/central directory|corrupted zip|end of data|is this a zip|could not find workbook|unsupported|reading 'async'|reading 'duongDan'|invalid|bad zip|not a zip/i.test(m))
    return 'File bị hỏng hoặc không phải file ' + (loai || 'Excel (.xlsx)') + '. Cô tải lại file gốc rồi chọn lại.';
  return m;
}
function docExcel(buf) {
  var wb = XLSX.read(buf, { type: 'array' }), out = {};
  wb.SheetNames.forEach(function (n) { out[n] = XLSX.utils.sheet_to_json(wb.Sheets[n], { header: 1, raw: false, defval: null }); });
  return { sheets: out, ten: wb.SheetNames };
}
var LOP_MUC = { 'Hoàn thành xuất sắc': 'm-xs', 'Hoàn thành tốt': 'm-htt', 'Hoàn thành': 'm-ht', 'Chưa hoàn thành': 'm-cht', 'Tốt': 'm-htt', 'Đạt': 'm-ht', 'Cần cố gắng': 'm-cht' };
var MAU_MUC = { 'Hoàn thành xuất sắc': '#5b9b3a', 'Hoàn thành tốt': '#a9d08e', 'Hoàn thành': '#bbb', 'Chưa hoàn thành': '#e8833a', 'Tốt': '#a9d08e', 'Đạt': '#bbb', 'Cần cố gắng': '#e8833a' };

// ============================================================================ ĐIỀU HƯỚNG + QUAY LẠI
// Mỗi màn hình là 1 "trạng thái". Đi tới màn mới thì ghi vào lịch sử của trình duyệt (google.script.history),
// nên nút Quay lại của điện thoại / trình duyệt và nút ← trên đầu app đều lùi về màn trước, không thoát app.
// Ghi chú kĩ thuật: trên Google, app chạy trong khung cách ly nên window.history.back() KHÔNG có tác dụng.
// Vì vậy app tự giữ "ngăn xếp" các màn đã đi qua; nút ← lấy từ ngăn xếp này.
// google.script.history chỉ dùng thêm để nút Back của điện thoại (nếu Google chuyển sự kiện vào) cũng lùi được.
var hienTai = { tab: 'trangchu', sau: 0 };
var nganXep = [];                         // các màn trước đó, màn gần nhất ở cuối
var coLichSu = !!(google.script && google.script.history);
var doSauTrinhDuyet = 0;                  // vị trí hiện tại trong lịch sử trình duyệt (chỉ để biết cô bấm Back hay Tới)
function ghiLichSu(tt, thayThe) {
  if (!coLichSu) return;
  if (!thayThe) doSauTrinhDuyet++;
  try { google.script.history[thayThe ? 'replace' : 'push']({ d: doSauTrinhDuyet }, null, tt.tab); } catch (e) {}
}
function diToi(tt) {                      // đi tới màn mới
  if (!roiDiDuoc()) return;
  nganXep.push(hienTai);
  ghiLichSu(tt);
  apDung(tt);
}
function luiMotBuoc() { apDung(nganXep.length ? nganXep.pop() : { tab: 'trangchu' }); }
function quayLai() {                      // nút ←, "Đổi bài", đóng hồ sơ…
  if (!roiDiDuoc()) return;
  luiMotBuoc();
}
if (coLichSu) google.script.history.setChangeHandler(function (e) {   // nút Back / Tới của điện thoại, trình duyệt
  var d = (e.state && e.state.d) || 0;
  var laBack = d < doSauTrinhDuyet;
  doSauTrinhDuyet = d;
  if (!laBack) return;                                                 // bấm "Tới": bỏ qua
  if (!roiDiDuoc()) { ghiLichSu(hienTai); return; }                   // cô chọn ở lại
  luiMotBuoc();                                                        // mỗi lần Back = lùi 1 màn trong app
});
function moTab(t) { if (t === hienTai.tab && !hienTai.buoc && !hienTai.hoSo) { apDung(hienTai); return; } diToi({ tab: t }); }
function apDung(tt) {
  var cu = hienTai; hienTai = tt; var t = tt.tab;
  if (nd) { $('ndModal').style.display = 'none'; nd = null; }
  if (mcTL || mcXemTT) { $('mcModal').style.display = 'none'; $('mcXem').style.display = 'none'; mcTL = null; mcXemTT = null; }
  if (cu.nhapDiem && t === 'danhgia' && cu.tab === t) { $('nutLui').classList.toggle('an', !(nganXep.length > 0)); veDanhGiaKy(); return; }   // chỉ đóng cửa sổ nhập điểm
  ['trangchu', 'diemdanh', 'sotheodoi', 'danhgia', 'hocsinh', 'caidat', 'huongdan'].forEach(function (x) { $('v-' + x).classList.toggle('an', x !== t); });
  document.querySelectorAll('nav button').forEach(function (b) { b.classList.toggle('on', b.dataset.t === t); });
  $('nutLui').classList.toggle('an', !(nganXep.length > 0 || t !== 'trangchu'));
  $('hoSo').style.display = tt.hoSo ? 'block' : 'none';
  if (!(cu.tab === t && tt.hoSo !== cu.hoSo)) window.scrollTo(0, 0);
  if (t === 'trangchu') taiTrangChu();
  if (t === 'diemdanh') taiDiemDanh();
  if (t === 'hocsinh') { if (tt.hoSo) hienHoSo(tt.hoSo); else if (!cu.hoSo || cu.tab !== 'hocsinh') taiHocSinh(); }
  if (t === 'caidat') taiCaiDat();
  if (t === 'danhgia') moDanhGia();
  if (t === 'sotheodoi') {
    if (tt.ngay) $('stNgay').value = tt.ngay;
    $('stPT').classList.add('an'); $('stChePT').classList.remove('on');
    if (tt.buoc === 'pt') moPhongTrao(tt.maPT);
    else if (tt.buoc === 'nhap') moBaiThat(tt.mon, tt.bai, tt.tiet, tt.ten);
    else if (tt.buoc === 'chung') moNhanXetChungThat();
    else hienChonBai();
  }
}
// Cảnh báo khi rời màn hình mà còn thao tác chưa lưu
function chuaLuu() {
  if (hienTai.tab === 'diemdanh' && dd && dd.sua) return 'điểm danh';
  if (hienTai.tab === 'sotheodoi' && (hienTai.buoc === 'nhap' || hienTai.buoc === 'chung') &&
      (Object.keys(st.chon).length || Object.keys(st.cau).length || $('stGhiChu').value.trim())) return 'nhận xét đang chọn';
  if (hienTai.tab === 'caidat' && ghData && ghData.doi && Object.keys(ghData.doi).length) return 'ghép tiết với bài';
  if (hienTai.tab === 'sotheodoi' && hienTai.buoc === 'pt' && hienTai.maPT && typeof ptCT !== 'undefined' && ptCT && ptCT.sua) return 'phong trào / cuộc thi chưa lưu';
  if (typeof mcTL !== 'undefined' && mcTL && mcTL.trang.length) return mcTL.trang.length + ' trang tài liệu vừa chụp chưa lưu';
  if (hienTai.tab === 'danhgia' && !hienTai.nhapDiem && typeof dkXem !== 'undefined' && Object.keys(dkXem).length) return Object.keys(dkXem).length + ' bản AI chưa chọn (Dùng / Giữ bản cũ)';
  return '';
}
function roiDiDuoc() {
  var c = chuaLuu(); if (!c) return true;
  if (!confirm('Cô chưa lưu ' + c + '. Rời màn hình này và bỏ các thay đổi?')) return false;
  if (dd) dd.sua = false; st.chon = {}; st.cau = {}; $('stGhiChu').value = ''; if (ghData) ghData.doi = {};
  return true;
}

// ============================================================================ TRANG CHỦ
function taiTrangChu() {
  var khoa = 'trangChu_' + homNayIso(), cu = null;
  try { cu = JSON.parse(localStorage.getItem(khoa) || 'null'); } catch (e) {}
  if (cu) veTrangChu(cu);          // hiện ngay bản lần trước (không có tên học sinh), máy chủ trả về thì vẽ lại
  (cu ? goi : chay)('layTrangChu').then(function (d) {
    try { Object.keys(localStorage).forEach(function (k) { if (/^trangChu_/.test(k) && k !== khoa) localStorage.removeItem(k); });
          localStorage.setItem(khoa, JSON.stringify(d)); } catch (e) {}
    veTrangChu(d);
  }, function () {});
}
function veTrangChu(d) {
  d = JSON.parse(JSON.stringify(d));
  {
    $('phuDe').textContent = [d.truong, d.lop ? 'Lớp ' + d.lop : '', d.namHoc ? 'Năm học ' + d.namHoc : ''].filter(Boolean).join(' · ') || 'Chưa có thông tin lớp';
    $('tcNgay').textContent = d.thu + ', ' + d.homNay;
    $('tcTuan').textContent = ['Tháng ' + d.thang, d.tuan ? 'Tuần ' + d.tuan : '', d.hocKy ? 'Học kì ' + d.hocKy : '', d.chuDe, d.siSo ? 'Sĩ số ' + d.siSo : ''].filter(Boolean).join(' · ');
    if (!d.siSo || !d.hocKy) d.nhac.unshift({ muc: 'xanh', text: '📖 Lần đầu dùng app? Chạm vào đây để xem Hướng dẫn sử dụng (mục 1: làm theo thứ tự).', toi: 'huongdan' });
    $('tcNhac').innerHTML = d.nhac.map(function (n) { return '<div class="nhac ' + n.muc + '" onclick="' + (n.toi ? "moTab('" + n.toi + "')" : '') + '">' + esc(n.text) + '</div>'; }).join('');
    $('tcLich').innerHTML = d.lich.length ? d.lich.map(function (r) {
      var co = !!r.mon;
      return '<div class="tiet ' + (co ? '' : 'mo') + '" ' + (co ? 'onclick="moTietTuTrangChu(' + r.tiet + ')"' : '') + '><div class="so">' + r.tiet + '</div><div><div class="mon">' + esc(r.monSBG) +
        (r.bai ? ' · <span class="nho">' + esc(r.bai) + '</span>' : '') + '</div><div class="ten">' + esc(r.ten) + '</div></div></div>';
    }).join('') : '<div class="nho">Hôm nay không có tiết dạy trong Sổ báo giảng.</div>';
    window._lichHomNay = d.lich;
  }
}
function moTietTuTrangChu(tiet) {
  var r = (window._lichHomNay || []).filter(function (x) { return +x.tiet === +tiet; })[0]; if (!r) return;
  diToi({ tab: 'sotheodoi', buoc: 'nhap', ngay: homNayIso(), mon: r.mon, bai: r.bai, tiet: r.tiet, ten: r.ten });
}

// ============================================================================ ĐIỂM DANH
var dd = null;
function taiDiemDanh() {
  if (!$('ddNgay').value) $('ddNgay').value = homNayIso();
  return chay('layDiemDanh', isoToDmy($('ddNgay').value)).then(function (d) { dd = d; dd.sua = false; veDiemDanh(); });
}
function doiNgayDiemDanh() {
  if (dd && dd.sua && !confirm('Cô chưa lưu điểm danh ngày ' + dd.ngay + '. Đổi ngày và bỏ thay đổi?')) { $('ddNgay').value = dmyToIso(dd.ngay); return; }
  taiDiemDanh();
}
function veDiemDanh() {
  var vang = dd.hocSinh.filter(function (h) { return h.trangThai !== 'Có mặt'; }).length;
  $('ddTomTat').innerHTML = 'Sĩ số ' + dd.hocSinh.length + ' · Có mặt ' + (dd.hocSinh.length - vang) + ' · Vắng ' + vang + ' · ' +
    (dd.sua ? '<span class="tag vang">chưa lưu</span>' : (dd.daLuu ? '<span class="tag xanh">đã lưu</span>' : '<span class="tag">chưa điểm danh</span>'));
  $('ddDs').innerHTML = dd.hocSinh.length ? dd.hocSinh.map(function (h, i) {
    var b = function (tt, cls, nhan) { return '<button class="' + cls + (h.trangThai === tt ? ' on' : '') + '" onclick="datDD(' + i + ',\'' + tt + '\')">' + nhan + '</button>'; };
    return '<div class="dd-hang"><div><span class="nho">' + (i + 1) + '.</span> ' + esc(h.ten) + '</div><div class="hang">' +
      '<span class="seg">' + b('Có mặt', 'co', 'Có mặt') + b('Vắng có phép', 'p', 'Vắng P') + b('Vắng không phép', 'kp', 'Vắng KP') + '</span>' +
      (h.trangThai !== 'Có mặt' ? '<select onchange="dd.hocSinh[' + i + '].buoi=this.value;dd.sua=true;veDiemDanh()">' + ['Cả ngày', 'Sáng', 'Chiều'].map(function (x) { return '<option' + (h.buoi === x ? ' selected' : '') + '>' + x + '</option>'; }).join('') + '</select>' : '') +
      '</div></div>';
  }).join('') : '<div class="nho">Chưa có danh sách học sinh.</div>';
}
function datDD(i, tt) { if (dd.hocSinh[i].trangThai !== tt) { dd.hocSinh[i].trangThai = tt; dd.sua = true; } veDiemDanh(); }
function datLaiDiemDanh() { if (!dd || !dd.sua) return bao('Chưa có thay đổi.'); if (confirm('Bỏ các thay đổi chưa lưu và tải lại điểm danh?')) taiDiemDanh(); }
function luuDiemDanhUI() {
  if (!dd || !dd.hocSinh.length) return bao('Chưa có danh sách học sinh – vào Học sinh → Tải danh sách trước.');
  // Lưu chạy ngầm: màn hình báo "đã lưu" ngay; nếu lỗi thì trả lại trạng thái "chưa lưu" để cô bấm lại
  var ngay = dd.ngay, cu = dd;
  dd.daLuu = true; dd.sua = false; veDiemDanh(); bao('Đang lưu điểm danh…', 20000);
  goi('luuDiemDanh', ngay, dd.hocSinh.map(function (h) { return { ma: h.ma, trangThai: h.trangThai, buoi: h.trangThai === 'Có mặt' ? '' : h.buoi, ghiChu: h.ghiChu }; }))
    .then(function (m) { bao(m + ' (Muốn sửa: chạm lại rồi Lưu lần nữa.)', 5000); },
          function (e) { if (dd === cu) { dd.sua = true; veDiemDanh(); } bao('Chưa lưu được điểm danh ' + ngay + ': ' + ((e && e.message) || e) + ' – bấm Lưu lần nữa.', 9000); });
}

// ============================================================================ SỔ THEO DÕI
var st = { tiet: [], mon: '', bai: '', soTiet: '', bo: null, hd: 0, muc: '', cau: {}, hs: [], chon: {} };
function doiCheDo(c) {
  if (c === 'pt') { if (hienTai.buoc !== 'pt' || hienTai.maPT) diToi({ tab: 'sotheodoi', buoc: 'pt' }); return; }
  if (c === 'chung') { if (hienTai.buoc !== 'chung') diToi({ tab: 'sotheodoi', buoc: 'chung', ngay: $('stNgay').value }); }
  else if (hienTai.buoc) moChonBai();
}
// Về màn chọn tiết/bài: nếu màn trước đó chính là màn chọn bài thì lùi về, không thì mở mới
function moChonBai() {
  var truoc = nganXep[nganXep.length - 1];
  if (truoc && truoc.tab === 'sotheodoi' && !truoc.buoc) quayLai();
  else diToi({ tab: 'sotheodoi', ngay: $('stNgay').value });
}
function hienChonBai() {
  $('stNhap').classList.add('an'); $('stChonBai').classList.remove('an');
  $('stCheBai').classList.add('on'); $('stCheChung').classList.remove('on');
  taiTietTrongNgay();
}
function taiTietTrongNgay() {
  if (!$('stNgay').value) $('stNgay').value = homNayIso();
  return Promise.all([chay('layTietTheoNgay', isoToDmy($('stNgay').value)), monList()]).then(function (k) {
    st.tiet = k[0];
    $('stTiet').innerHTML = st.tiet.length ? st.tiet.map(function (r) {
      return '<div class="tiet" onclick="chonTiet(' + r.tiet + ')"><div class="so">' + r.tiet + '</div><div><div class="mon">' + esc(r.monSBG) + '</div><div class="ten">' +
        esc(r.bai || r.ten) + (r.bai ? '' : ' <span class="tag vang">thư viện tạm</span>') + '</div></div></div>';
    }).join('') : '<div class="nho">Ngày này không có tiết của các môn cô đánh giá. Dùng "Chọn bài khác" bên dưới.</div>';
  });
}
function doiNgaySTD() {
  if (hienTai.buoc && chuaLuu() && !confirm('Cô chưa lưu nhận xét đang chọn. Đổi ngày và bỏ thay đổi?')) return;
  st.chon = {}; st.cau = {}; $('stGhiChu').value = '';
  if (hienTai.buoc === 'nhap') diToi({ tab: 'sotheodoi', ngay: $('stNgay').value }); else if (hienTai.buoc === 'chung') moNhanXetChungThat(); else taiTietTrongNgay();
}
var _monHoc = null;
function monList() {
  if (_monHoc) return Promise.resolve(_monHoc);
  return goi('layMonDangDay').then(function (ds) {
    _monHoc = ds;
    $('stMon').innerHTML = '<option value="">– chọn môn –</option>' + _monHoc.map(function (m) { return '<option>' + esc(m.TenMon) + '</option>'; }).join('');
    return _monHoc;
  });
}
function taiBaiCuaMon() {
  var mon = $('stMon').value; if (!mon) return;
  chay('layDanhSachBai', mon).then(function (ds) {
    $('stBai').innerHTML = ds.length ? ds.map(function (b) { return '<option value="' + esc(b.bai) + '">Tuần ' + esc(b.tuan) + ' – ' + esc(b.bai) + '</option>'; }).join('')
      : '<option value="">(môn này chưa có thư viện – dùng thư viện tạm)</option>';
  });
}
function chonTiet(tiet) {
  var r = st.tiet.filter(function (x) { return +x.tiet === +tiet; })[0]; if (!r) return;
  diToi({ tab: 'sotheodoi', buoc: 'nhap', ngay: $('stNgay').value, mon: r.mon, bai: r.bai, tiet: r.tiet, ten: r.ten });
}
function moBaiTuChon() {
  var mon = $('stMon').value; if (!mon) return bao('Chọn môn trước.');
  diToi({ tab: 'sotheodoi', buoc: 'nhap', ngay: $('stNgay').value, mon: mon, bai: $('stBai').value, tiet: '', ten: '' });
}
function moBaiThat(mon, bai, tiet, tenSBG) {
  st.mon = mon; st.bai = bai || tenSBG || ''; st.soTiet = tiet; st.hd = 0; st.muc = ''; st.cau = {}; st.chon = {}; $('stGhiChu').value = '';
  var ngay = isoToDmy($('stNgay').value);
  $('stCheBai').classList.add('on'); $('stCheChung').classList.remove('on');
  Promise.all([chay('layBoNhanXet', mon, bai), chay('layHocSinhChoBai', ngay, mon, st.bai)]).then(function (k) {
    st.bo = k[0]; st.hs = k[1];
    $('stMonTen').textContent = mon + (tiet ? ' · Tiết ' + tiet : '') + ' · ' + ngay;
    $('stBaiTen').textContent = st.bai || '(chưa ghép bài)';
    $('stTam').innerHTML = st.bo.tam ? '<span class="tag vang">Môn/bài này chưa có thư viện – đang dùng thư viện tạm</span>' : '';
    $('stChonBai').classList.add('an'); $('stNhap').classList.remove('an');
    veNhap();
  });
}
function moNhanXetChungThat() {
  $('stCheBai').classList.remove('on'); $('stCheChung').classList.add('on');

// ============================================================================ VIẾT LẠI BẰNG AI (chỉ CK1, CK2) – xem trước, Dùng / Giữ / Viết lại, hoàn tác, lịch sử
// dkXem['mã|phần|trường'] = { sau, lan, lo }: bản AI đang chờ cô chọn. dk.lichSu: các lần đã dùng bản AI (để hoàn tác, xoá khi xuất file).
var dkXem = {};
var TEN_TRUONG = { nlc: 'Năng lực chung', nld: 'Năng lực đặc thù', pc: 'Phẩm chất chủ yếu' };
function coAI() { return !!(dk && dk.cuoiKy && aiCD.coKhoa); }

function thoatRegex(s) { return s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); }
// Bỏ tên học sinh khỏi nội dung trước khi gửi AI (cô có thể đã gõ tên khi sửa nhận xét)
function anDanh(text, ma) {
  var h = dk.hs.filter(function (x) { return x.ma === ma; })[0], t = String(text || '');
  if (!h) return t;
  var ten = h.ten.trim(), goi = ten.split(/\s+/).pop();
  t = t.replace(new RegExp(thoatRegex(ten), 'gi'), 'em');
  t = t.replace(new RegExp('(^|[\\s,.;:!?(])(em|bạn|con)\\s+' + thoatRegex(goi) + '(?=$|[\\s,.;:!?)])', 'gi'), '$1$2');
  return t.replace(/\d{6,}/g, '');
}
function mucGuiAI(key, k) {
  var x = tachKhoa(key), o = oCua(x.ma, x.phan), muc;
  if (x.phan === 'NLPC') {
    var ds = x.truong === 'nlc' ? dk.nhomNLPC.chung : x.truong === 'nld' ? dk.nhomNLPC.dacThu : dk.nhomNLPC.pc;
    muc = ds.map(function (t) { return t + ': ' + (o.muc[t] || '?'); }).join('; ');
  } else muc = o.muc;
  if (x.phan === 'GVCN') return { k: k, phan: 'Nhận xét GVCN cuối năm', muc: o.tomTat, goc: anDanh(o.nx, x.ma) };
  return { k: k, phan: x.phan === 'NLPC' ? TEN_TRUONG[x.truong] : 'Môn ' + x.phan, muc: muc, diem: x.phan === 'NLPC' ? '' : (o.diem || ''), goc: anDanh(o[x.truong], x.ma) };

// Dùng bản AI cho 1 hoặc nhiều ô (cùng 1 "lần" → hoàn tác được cùng nhau)
function aiDung(keys) {
  boFocus();

  if (!keys.length) return;
  var lo = dkXem[keys[0]].lo, nhom = {};
  keys.forEach(function (key) {
    var x = tachKhoa(key), g = nhom[x.ma + '|' + x.phan] = nhom[x.ma + '|' + x.phan] || { ma: x.ma, phan: x.phan, ls: [] };
    g.ls.push({ truong: x.truong, truoc: oCua(x.ma, x.phan)[x.truong] || '', sau: dkXem[key].sau });
  });
  var ds = Object.keys(nhom).map(function (k) {

      ['STT', 'Ngày', 'Phong trào / cuộc thi', 'Loại', 'Cấp', 'Mã định danh', 'Họ và tên', 'Ngày sinh', 'Kết quả', 'Ghi chú']]; };
    var dongX = function (ds) { return ds.map(function (r, i) { return [i + 1, r.ngay, r.ten, r.loai, r.cap, r.ma, r.hoTen, r.ns, r.kq, r.gc]; }); };
    var giai = d.dong.filter(function (r) { return r.kq !== 'Tham gia'; });
    var wb = XLSX.utils.book_new(), rong = [5, 11, 32, 18, 14, 13, 26, 11, 18, 26].map(function (w) { return { wch: w }; });
    [['Đạt giải, được khen', dau('DANH SÁCH HỌC SINH ĐẠT GIẢI, ĐƯỢC KHEN').concat(dongX(giai))],
     ['Tất cả tham gia', dau('DANH SÁCH HỌC SINH THAM GIA PHONG TRÀO, CUỘC THI').concat(dongX(d.dong))]].forEach(function (x) {
      var sh = XLSX.utils.aoa_to_sheet(x[1]); sh['!cols'] = rong; sh['!merges'] = [0, 1].map(function (r) { return { s: { r: r, c: 0 }, e: { r: r, c: 9 } }; });
      XLSX.utils.book_append_sheet(wb, sh, x[0]);
    });
    var ten = ('Phong trao cuoc thi ' + d.namHoc + ' - Lop ' + d.lop).replace(/[\\/:*?"<>|]/g, '-') + '.xlsx';
    hienKetQuaXuat($('ptKetQua'), ten, XLSX.write(wb, { bookType: 'xlsx', type: 'base64' }),
      '<div class="nho">' + d.soPT + ' phong trào / cuộc thi · ' + d.dong.length + ' lượt tham gia · ' + giai.length + ' lượt đạt giải, được khen.</div>', false);
  });
}
