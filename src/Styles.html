<style>
  :root {
    --nen: #f4f6fa; --the: #ffffff; --chu: #1d2433; --mo: #667085; --vien: #dfe3ea;
    --chinh: #1f4e79; --chinh-nhat: #e8f0f9; --xanh: #2e7d32; --vang: #b26a00; --do: #c62828;
    --xs: #a9d08e; --htt: #e2efda; --ht: #ffffff; --cht: #fce4d6;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: Roboto, "Segoe UI", Arial, sans-serif; background: var(--nen); color: var(--chu); font-size: 16px; }
  header { background: var(--chinh); color: #fff; padding: 12px 16px; position: sticky; top: 0; z-index: 5; }
  header h1 { font-size: 17px; margin: 0; font-weight: 600; }
  header .phu { font-size: 13px; opacity: .85; margin-top: 2px; }
  main { padding: 12px 12px 150px; max-width: 900px; margin: 0 auto; }
  nav { position: fixed; bottom: 0; left: 0; right: 0; background: #fff; border-top: 1px solid var(--vien); display: flex; z-index: 6; }
  nav button { flex: 1; border: 0; background: none; padding: 8px 1px 10px; font-size: 11px; white-space: nowrap; color: var(--mo); cursor: pointer; }
  nav button .ic { display: block; font-size: 21px; line-height: 1.2; }
  nav button.on { color: var(--chinh); font-weight: 600; }
  .the { background: var(--the); border-radius: 12px; padding: 14px; margin-bottom: 12px; box-shadow: 0 1px 2px rgba(0,0,0,.06); }
  .the h2 { font-size: 16px; margin: 0 0 10px; color: var(--chinh); }
  .the h3 { font-size: 15px; margin: 14px 0 8px; }
  .ngay-lon { font-size: 20px; font-weight: 700; }
  .nho { font-size: 13px; color: var(--mo); }
  .hang { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .gian { justify-content: space-between; }
  button.nut { border: 0; border-radius: 10px; padding: 11px 16px; font-size: 15px; cursor: pointer; background: var(--chinh); color: #fff; }
  button.nut.phu { background: var(--chinh-nhat); color: var(--chinh); }
  button.nut.do { background: var(--do); }
  button.nut:disabled { opacity: .5; }
  button.nut.lon { width: 100%; padding: 14px; font-size: 16px; }
  .luoi-nut { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
  .luoi-nut button { padding: 14px 2px; font-size: 14px; line-height: 1.25; }
  input, select, textarea { font-size: 16px; padding: 9px 10px; border: 1px solid var(--vien); border-radius: 8px; background: #fff; max-width: 100%; }
  textarea { width: 100%; min-height: 60px; }
  label.dong { display: block; margin: 8px 0 4px; font-size: 14px; color: var(--mo); }
  .nhac { border-radius: 10px; padding: 10px 12px; margin-bottom: 8px; font-size: 14px; cursor: pointer; border-left: 5px solid; }
  .nhac.do { background: #fdecea; border-color: var(--do); }
  .nhac.vang { background: #fff4e0; border-color: var(--vang); }
  .nhac.xanh { background: #e8f5e9; border-color: var(--xanh); }
  .tiet { display: flex; gap: 10px; padding: 10px 4px; border-bottom: 1px solid var(--vien); cursor: pointer; align-items: flex-start; }
  .tiet:last-child { border-bottom: 0; }
  .tiet .so { min-width: 30px; height: 30px; border-radius: 50%; background: var(--chinh-nhat); color: var(--chinh); display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 14px; }
  .tiet.mo .so { background: #eee; color: #999; }
  .tiet .mon { font-weight: 600; font-size: 14px; }
  .tiet .ten { font-size: 14px; color: var(--mo); }
  .chip { display: inline-block; border: 1px solid var(--vien); border-radius: 18px; padding: 7px 12px; margin: 3px; font-size: 14px; cursor: pointer; background: #fff; user-select: none; }
  .chip.on { background: var(--chinh); color: #fff; border-color: var(--chinh); }
  .hs-luoi { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 6px; }
  .hs { border: 1px solid var(--vien); border-radius: 10px; padding: 8px; font-size: 14px; cursor: pointer; background: #fff; position: relative; min-height: 46px; }
  .hs.on { border-color: var(--chinh); background: var(--chinh-nhat); box-shadow: inset 0 0 0 1px var(--chinh); }
  .hs .stt { color: var(--mo); font-size: 12px; }
  .hs .dau { position: absolute; top: 6px; right: 6px; width: 12px; height: 12px; border-radius: 50%; border: 1px solid #999; }
  .muc { display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px; }
  .muc button { border: 2px solid transparent; border-radius: 10px; padding: 11px 6px; font-size: 14px; cursor: pointer; color: var(--chu); }
  .muc button.on { border-color: var(--chinh); font-weight: 700; }
  .m-xs { background: var(--xs); } .m-htt { background: var(--htt); } .m-ht { background: #f2f2f2; } .m-cht { background: var(--cht); }
  .cau { display: flex; gap: 8px; padding: 9px; border: 1px solid var(--vien); border-radius: 8px; margin-bottom: 6px; cursor: pointer; background: #fff; font-size: 15px; }
  .cau.on { border-color: var(--chinh); background: var(--chinh-nhat); }
  table.bang { width: 100%; border-collapse: collapse; font-size: 14px; }
  table.bang th, table.bang td { border-bottom: 1px solid var(--vien); padding: 7px 5px; text-align: left; vertical-align: top; }
  table.bang th { background: #f0f3f8; position: sticky; top: 0; }
  .cuon { max-height: 60vh; overflow: auto; }
  .dd-hang { display: flex; align-items: center; justify-content: space-between; gap: 6px; padding: 8px 2px; border-bottom: 1px solid var(--vien); flex-wrap: wrap; }
  .seg { display: inline-flex; border: 1px solid var(--vien); border-radius: 8px; overflow: hidden; }
  .seg button { border: 0; background: #fff; padding: 8px 10px; font-size: 13px; cursor: pointer; }
  .seg button.on.co { background: #e8f5e9; color: var(--xanh); font-weight: 700; }
  .seg button.on.p { background: #fff4e0; color: var(--vang); font-weight: 700; }
  .seg button.on.kp { background: #fdecea; color: var(--do); font-weight: 700; }
  .nhom-dau { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-left: 4px; vertical-align: middle; }
  /* Nộp vở: bảng tên – 6 cột mức, tiêu đề cột dính dưới thanh trên cùng */
  .vo-bang { margin: -4px -6px 0; }
  /* Tiêu đề môn ở màn đánh giá tháng */
  .mon-lon { font-size: 22px; font-weight: 900; letter-spacing: .5px; text-align: center; padding: 10px 12px; margin: -2px 0 12px; border-radius: 12px;
             color: #fff; background: linear-gradient(120deg, var(--chinh), var(--chinh2)); }
  .mon-lon.toan { background: linear-gradient(120deg, #1d4ed8, #3b82f6); }
  .mon-lon.tv { background: linear-gradient(120deg, #be123c, #f43f5e); }
  .vo-dong { display: grid; grid-template-columns: minmax(110px, 1fr) repeat(6, minmax(32px, 44px)); align-items: stretch; border-bottom: 1px solid var(--vien); }
  .vo-dong:nth-child(odd):not(.vo-dau) { background: #f8fafc; }
  .vo-dong.chua { background: #fff8ec !important; }
  .vo-dau { position: sticky; top: var(--cao-dau, 64px); z-index: 3; background: #fff; box-shadow: 0 2px 4px rgba(16,24,40,.08); }
  .vo-goc { font-weight: 800; font-size: 14px; padding: 6px; display: flex; flex-direction: column; justify-content: flex-end; }
  .vo-goc .nho { font-weight: 400; font-size: 10.5px; line-height: 1.2; }
  .vo-cot { font-size: 10.5px; line-height: 1.15; font-weight: 700; text-align: center; padding: 6px 2px 4px; border-left: 1px solid var(--vien); border-top: 4px solid var(--xanh);
            display: flex; flex-direction: column; justify-content: space-between; align-items: center; gap: 3px; cursor: pointer; color: #1a2433; }
  .vo-cot.p { border-top-color: var(--vang); } .vo-cot.kp { border-top-color: var(--do); }
  .vo-cot b { font-size: 11px; background: #eef1f6; border-radius: 8px; padding: 0 6px; }
  .vo-ten { display: flex; gap: 6px; align-items: flex-start; padding: 8px 6px; }
  .vo-o { border: 0; border-left: 1px solid var(--vien); background: transparent; cursor: pointer; padding: 0; display: flex; align-items: center; justify-content: center; min-height: 48px; }
  .vo-o span { width: 25px; height: 25px; border-radius: 50%; border: 2px solid #c7cdd6; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 900; color: #fff; }
  .vo-o.on.co span { background: var(--xanh); border-color: var(--xanh); } .vo-o.on.p span { background: var(--vang); border-color: var(--vang); } .vo-o.on.kp span { background: var(--do); border-color: var(--do); }
  @media (min-width: 640px) { .vo-dong { grid-template-columns: 220px repeat(6, 1fr); } .vo-cot { font-size: 12.5px; } }
  .vo-stt { display: inline-flex; vertical-align: middle; min-width: 20px; height: 20px; border-radius: 10px; background: var(--chinh); color: #fff; font-size: 11px; font-weight: 700; align-items: center; justify-content: center; }
  .vo-dem { font-size: 12.5px; color: #5b6472; line-height: 1.2; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .vo-ten .tag { font-size: 10.5px; padding: 1px 6px; margin-top: 2px; }
  .vo-ho { font-size: 15.5px; font-weight: 800; color: #1a2433; line-height: 1.2; }

  .vo-nut button { border: 1px solid var(--vien); background: #fff; border-radius: 8px; padding: 7px 4px; font-size: 12.5px; cursor: pointer; line-height: 1.2; }
  .vo-nut button.on.co { background: #e8f5e9; color: var(--xanh); border-color: var(--xanh); font-weight: 700; }
  .vo-nut button.on.p { background: #fff4e0; color: var(--vang); border-color: var(--vang); font-weight: 700; }
  .vo-nut button.on.kp { background: #fdecea; color: var(--do); border-color: var(--do); font-weight: 700; }
  .the-chan { position: fixed; bottom: 64px; left: 0; right: 0; padding: 10px 12px; background: rgba(244,246,250,.96); border-top: 1px solid var(--vien); z-index: 4; }
  .the-chan .trong { max-width: 900px; margin: 0 auto; }
  #toast { position: fixed; left: 50%; bottom: 140px; transform: translateX(-50%); background: #1d2433; color: #fff; padding: 10px 14px; border-radius: 10px; font-size: 14px; z-index: 20; display: none; width: max-content; max-width: 94%; align-items: center; gap: 10px; }
  #toast button { background: #ffd54f; color: #1d2433; border: 0; border-radius: 8px; padding: 8px 12px; font-weight: 700; font-size: 14px; cursor: pointer; white-space: nowrap; }
  #toast span { white-space: pre-line; }
  .nut-lui { background: rgba(255,255,255,.15); color: #fff; border: 0; border-radius: 10px; font-size: 22px; width: 42px; height: 42px; cursor: pointer; flex: none; }
  .the-chan .trong .nut.phu { flex: none; }
  #cho { position: fixed; inset: 0; background: rgba(255,255,255,.6); display: none; align-items: center; justify-content: center; z-index: 30; font-size: 15px; }
  #cho div { background: #fff; padding: 14px 20px; border-radius: 10px; box-shadow: 0 2px 10px rgba(0,0,0,.15); }
  .modal { position: fixed; inset: 0; background: rgba(0,0,0,.35); display: none; z-index: 15; overflow: auto; padding: 20px 10px; }
  .modal .the { max-width: 760px; margin: 0 auto; }
  .tag { display: inline-block; font-size: 12px; padding: 2px 7px; border-radius: 6px; background: #eef1f6; color: var(--mo); }
  .tag.vang { background: #fff4e0; color: var(--vang); } .tag.do { background: #fdecea; color: var(--do); } .tag.xanh { background: #e8f5e9; color: var(--xanh); }
  .an { display: none !important; }
  details summary { cursor: pointer; font-weight: 600; color: var(--chinh); padding: 4px 0; }
  .hd ol, .hd ul { margin: 8px 0; padding-left: 22px; line-height: 1.5; font-size: 15px; }
  .hd li { margin-bottom: 6px; }
  .hd details summary { font-size: 16px; padding: 6px 0; }
  .bm-hs { border-left: 4px solid var(--chinh); }
  .bm-hs.trong { border-left-color: var(--do); }
  .bm-o { margin-top: 8px; }
  .bm-o label { display: flex; justify-content: space-between; font-size: 13px; color: var(--mo); margin-bottom: 3px; }
  .bm-o textarea { min-height: 54px; font-size: 15px; }
  .nd-ten { font-size: 20px; font-weight: 700; margin: 8px 0 2px; }
  .nd-luoi { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; margin: 12px 0; }
  .nd-so { font-size: 22px; padding: 14px 0; border: 1px solid var(--vien); border-radius: 10px; background: #fff; cursor: pointer; color: var(--chu); }
  .nd-so.dang { background: var(--chinh); color: #fff; border-color: var(--chinh); }
  .nd-so.goiy { box-shadow: 0 0 0 3px #f9a825; font-weight: 700; }
  .nd-ai { background: #fff8e1; border-radius: 8px; padding: 8px 10px; font-size: 14px; margin-top: 8px; }
  .nd-cat { position: relative; touch-action: none; user-select: none; margin-top: 8px; overflow: hidden; border-radius: 8px; }
  .nd-cat img { width: 100%; display: block; pointer-events: none; }
  .nd-khung { position: absolute; border: 3px solid #f9a825; box-shadow: 0 0 0 9999px rgba(0,0,0,.4); box-sizing: border-box; cursor: move; }
  .nd-goc { position: absolute; right: -2px; bottom: -2px; width: 26px; height: 26px; background: #f9a825; border-radius: 6px 0 6px 0; cursor: nwse-resize; }
  .ai-xem { background: #f5f0ff; border: 1px solid #d3c4f5; border-radius: 8px; padding: 8px 10px; margin-top: 6px; }
  .ai-ban { font-size: 15px; margin: 4px 0 8px; line-height: 1.45; }
  .ai-thanh { margin-top: 10px; padding-top: 8px; border-top: 1px dashed var(--vien); }
  button.nut.nut-nho { padding: 4px 9px; font-size: 12px; border-radius: 7px; }
  .bm-o label > span:last-child { display: inline-flex; gap: 4px; align-items: center; flex-wrap: wrap; justify-content: flex-end; }
  .bm-o textarea[data-phan="GVCN"] { min-height: 130px; }
  .mc-tl { display: flex; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--vien); align-items: flex-start; }
  .mc-anh { display: flex; gap: 3px; cursor: pointer; flex: none; }
  .mc-anh img, .mc-o { width: 44px; height: 58px; object-fit: cover; border-radius: 4px; border: 1px solid var(--vien); }
  .mc-o { display: inline-flex; align-items: center; justify-content: center; background: var(--nen); color: var(--mo); font-size: 13px; }
  .mc-luoi { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 8px; margin: 10px 0; }
  .mc-trang { border: 1px solid var(--vien); border-radius: 8px; padding: 4px; text-align: center; }
  .mc-trang img { width: 100%; height: 130px; object-fit: cover; border-radius: 4px; display: block; }
  #mcXemAnh { width: 100%; max-height: 70vh; object-fit: contain; background: #222; border-radius: 8px; display: block; }
  .hs .kq { display: block; font-size: 11px; color: var(--chinh); font-weight: 600; margin-top: 2px; }
  .pt-the { cursor: pointer; }
  .pt-hang { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; padding: 6px 0; border-bottom: 1px solid var(--vien); }
  .pt-hang .ten { flex: 1; min-width: 140px; }
  header h1, header .phu { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  header .nut-dau { width: 38px; height: 38px; font-size: 18px; margin-left: 4px; }
  header .nut-dau.on { background: rgba(255,255,255,.35); }
  .cn-hang { display: flex; gap: 10px; align-items: flex-start; padding: 8px 2px; border-bottom: 1px solid var(--vien); cursor: pointer; }
  .cn-hang input { width: 20px; height: 20px; margin-top: 2px; flex: none; }
  #tgDs .bm-o textarea { min-height: 80px; }
  .tg-hang { display: flex; align-items: center; gap: 8px; margin-top: 6px; flex-wrap: wrap; }
  .tg-nhan { min-width: 74px; font-size: 13px; color: var(--mo); }
  .bm-o .dem.vuot { color: var(--do); font-weight: 700; }
  ul.canh { margin: 6px 0; padding-left: 18px; font-size: 14px; color: var(--vang); }
  /* ================================================================== GIAO DIỆN MỚI (04/10/2026): màu theo từng khu vực, thẻ nổi, biểu tượng */
  /* Mỗi khu vực một màu chủ đạo: đổi --chinh / --chinh2 / --chinh-nhat theo body[data-tab] → nút, chip, tiêu đề, thanh trên tự đổi theo */
  body { --chinh: #1e5fbf; --chinh2: #3b9be8; --chinh-nhat: #e7f0fc; }
  body[data-tab="diemdanh"]  { --chinh: #15803d; --chinh2: #3fb871; --chinh-nhat: #e6f6ec; }
  body[data-tab="sotheodoi"] { --chinh: #c2410c; --chinh2: #f59a4a; --chinh-nhat: #fdf0e6; }
  body[data-tab="danhgia"]   { --chinh: #6d28d9; --chinh2: #a47cf3; --chinh-nhat: #f1eafd; }
  body[data-tab="hocsinh"]   { --chinh: #be185d; --chinh2: #ee6aa6; --chinh-nhat: #fce8f1; }
  body[data-tab="caidat"]    { --chinh: #334e68; --chinh2: #6b8cad; --chinh-nhat: #e9eff5; }
  body[data-tab="huongdan"]  { --chinh: #0f766e; --chinh2: #35b9a8; --chinh-nhat: #e3f5f2; }
  body { background: radial-gradient(circle at 0 0, var(--chinh-nhat) 0, rgba(255,255,255,0) 340px), radial-gradient(circle at 100% 30%, #fff6e5 0, rgba(255,255,255,0) 300px), #f3f5fa; background-attachment: fixed; transition: background-color .3s; }

  /* Thanh trên: chuyển màu, bo góc, chấm trang trí */
  header { background: radial-gradient(circle at 92% -20%, rgba(255,255,255,.28) 0, rgba(255,255,255,0) 90px), radial-gradient(circle at 70% 140%, rgba(255,255,255,.18) 0, rgba(255,255,255,0) 70px), linear-gradient(120deg, var(--chinh), var(--chinh2));
    border-radius: 0 0 18px 18px; box-shadow: 0 4px 14px rgba(0,0,0,.12); padding: 12px 14px 14px; transition: background .3s; }
  header h1 { font-size: 18px; font-weight: 700; letter-spacing: .2px; }
  .nut-lui { background: rgba(255,255,255,.2); border-radius: 12px; }
  .nut-lui:active { transform: scale(.94); }

  /* Thẻ */
  .the { border-radius: 16px; padding: 16px; box-shadow: 0 1px 3px rgba(16,24,40,.06), 0 4px 14px rgba(16,24,40,.05); border: 1px solid rgba(16,24,40,.04); }
  .the h2 { font-size: 17px; display: flex; align-items: center; gap: 8px; color: var(--chinh); }
  .the h2::before { content: ''; width: 5px; height: 20px; border-radius: 3px; background: linear-gradient(var(--chinh2), var(--chinh)); flex: none; }
  .the h2[style*="margin:0"]::before { height: 18px; }
  .the h3 { color: #344054; }
  details summary { color: var(--chinh); }

  /* Nút */
  button.nut { background: linear-gradient(135deg, var(--chinh), var(--chinh2)); box-shadow: 0 2px 6px rgba(0,0,0,.12); font-weight: 600; transition: transform .08s, box-shadow .2s; }
  button.nut:active { transform: scale(.97); box-shadow: 0 1px 2px rgba(0,0,0,.12); }
  button.nut.phu { background: var(--chinh-nhat); color: var(--chinh); box-shadow: none; }
  button.nut.do { background: linear-gradient(135deg, #b42318, #e5484d); }
  .chip { border-radius: 20px; transition: background .15s; }
  .chip.on { background: linear-gradient(135deg, var(--chinh), var(--chinh2)); border-color: transparent; box-shadow: 0 2px 6px rgba(0,0,0,.12); }
  input:focus, select:focus, textarea:focus { outline: 2px solid var(--chinh2); outline-offset: 0; border-color: transparent; }

  /* Thanh điều hướng dưới: mỗi mục một màu, mục đang mở nổi lên */
  nav { border-top: 0; box-shadow: 0 -4px 16px rgba(16,24,40,.08); border-radius: 18px 18px 0 0; padding: 4px 4px 2px; }
  nav button .ic { width: 46px; height: 32px; margin: 0 auto 2px; border-radius: 16px; display: flex; align-items: center; justify-content: center; font-size: 20px; transition: background .2s, transform .2s; }
  nav button.on { color: var(--chinh); font-weight: 700; }
  nav button.on .ic { background: var(--chinh-nhat); transform: translateY(-2px); }
  .the-chan { background: rgba(255,255,255,.92); backdrop-filter: blur(6px); border-top: 0; box-shadow: 0 -4px 14px rgba(16,24,40,.06); bottom: 66px; }

  /* Trang chủ: thẻ ngày có hình minh hoạ, nút nhanh nhiều màu */
  .hero { position: relative; overflow: hidden; color: #fff; border: 0; min-height: 108px; padding-right: 100px;
    background: radial-gradient(circle at 85% 20%, rgba(255,255,255,.25) 0, rgba(255,255,255,0) 60px), linear-gradient(125deg, #1e5fbf, #3b9be8 60%, #5cc6e8); }
  .hero .ngay-lon { font-size: 21px; white-space: nowrap; }
  .hero .nho { color: rgba(255,255,255,.92); font-size: 14px; line-height: 1.45; }
  .hero .loi-chao { font-size: 13px; opacity: .9; margin-bottom: 2px; }
  .hero svg { position: absolute; right: 4px; bottom: 0; width: 100px; height: 84px; }
  .luoi-nut button.o-nhanh { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 12px 2px 10px; border-radius: 14px; color: #fff; font-size: 13px; font-weight: 600; }
  .luoi-nut .o-ic { width: 40px; height: 40px; border-radius: 50%; background: rgba(255,255,255,.28); display: flex; align-items: center; justify-content: center; font-size: 21px; }
